    <!-- Favicons: SVG prioritized, with smart fallbacks for older browsers -->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Fallback: PNG 32x32 for browsers without SVG support -->
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
    <!-- Legacy fallback: ICO for very old browsers -->
    <link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon">
    <!-- Apple/iOS: Home screen icon (no sizes needed, iOS handles this) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp previews) - FALLBACK -->
